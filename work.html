          href="https://jenkins.itops.finapi.net/job/deploy_staging/build?delay=0sec"
        ><span class="ico" aria-hidden="true"><i class="fa-brands fa-jenkins"></i></span
          ><span class="lbl">Deploy job</span></a>
        </div>
      </div>
    </div>

    <button class="mode" type="button" aria-pressed="false">Columns</button>

    <script>
      (function () {
        var root = document.documentElement,
          knob = document.querySelector(".mode");

        function paint() {
          var columns = root.classList.contains("as-columns");
          knob.textContent = columns ? "Map" : "Columns";
          knob.setAttribute("aria-pressed", columns);
        }

        paint();

        knob.addEventListener("click", function () {
          var columns = root.classList.toggle("as-columns");
          try {
            localStorage.setItem(
              "startpages-view",
              columns ? "columns" : "map"
            );
          } catch (e) {}
          paint();
        });
      })();
    </script>
  </body>
</html>
