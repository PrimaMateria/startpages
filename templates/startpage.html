<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070a" />
    <title>{{ startpage.name }}</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="public/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="public/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="public/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="public/favicon/site.webmanifest" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" type="text/css" href="css/styles.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="deep" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="viewport">
      <div class="map" style="width: {{ map.width }}px; height: {{ map.height }}px">
        <svg
          class="wiring"
          viewBox="0 0 {{ map.width }} {{ map.height }}"
          width="{{ map.width }}"
          height="{{ map.height }}"
          aria-hidden="true"
        >
          {%- for breath in map.field %}
          <g class="breath" style="--beat: -{{ breath.beat }}s">
            {%- for strand in breath.strands %}
            <path class="strand" d="{{ strand.d | safe }}" style="--fade: {{ strand.ink }}; --thread: {{ strand.tint }}" />
            {%- endfor %}
          </g>
          {%- endfor %}
          {%- for ripple in map.ripples %}
          <path class="ripple" d="{{ ripple.d | safe }}" style="--thread: {{ ripple.tint }}; --wake: -{{ ripple.wake }}s" />
          {%- endfor %}
          {%- for bough in map.boughs %}
          {%- if bough.tone >= 0 %}
          <path class="bough is-tip" d="{{ bough.d | safe }}" style="--tone: var(--tone-{{ bough.tone }})" />
          {%- else %}
          <path class="bough" d="{{ bough.d | safe }}" />
          {%- endif %}
          {%- endfor %}
          {%- for branch in map.branches %}
          <g style="--tone: var(--tone-{{ branch.tone }})">
            {%- for stem in branch.stems %}
            <path class="stem" d="{{ stem | safe }}" />
            {%- endfor %}
            {%- for leaf in branch.leaves %}
            <path class="vein" d="{{ leaf.vein | safe }}" />
            {%- endfor %}
            {%- for bud in branch.buds %}
            <circle class="bud" cx="{{ bud.x }}" cy="{{ bud.y }}" r="2.6" />
            {%- endfor %}
            <circle class="node" cx="{{ branch.node_x }}" cy="{{ branch.node_y }}" r="4" />
          </g>
          {%- endfor %}
        </svg>

        <h1 class="root" style="left: {{ map.core_x }}px; top: {{ map.core_y }}px">
          {{ startpage.name }}
        </h1>

        <nav class="strip">
          {%- for other in map.others %}
          <a class="other{% if other.here %} is-here{% endif %}" style="left: {{ other.x }}px; top: {{ other.y }}px" href="{{ other.path | safe }}"{% if other.here %} aria-current="page"{% endif %}>{{ other.name }}</a>
          {%- endfor %}
        </nav>

        {%- for branch in map.branches %}
        <h2
          class="branch"
          style="left: {{ branch.name_x }}px; top: {{ branch.name_y }}px; --tone: var(--tone-{{ branch.tone }})"
        >{{ branch.name }}</h2>
        {%- for leaf in branch.leaves %}
        <a
          class="leaf"
          style="left: {{ leaf.x }}px; top: {{ leaf.y }}px; --tone: var(--tone-{{ branch.tone }})"
          href="{{ leaf.url | safe }}"
        ><span class="ico" aria-hidden="true">{{ leaf.ico | safe }}</span
          ><span class="lbl">{{ leaf.lbl }}</span></a>
        {%- endfor %}
        {%- endfor %}
      </div>
    </div>
  </body>
</html>
