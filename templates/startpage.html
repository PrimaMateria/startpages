<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070a" />
    <title>{{ startpage.name }}</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="public/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="public/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="public/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="public/favicon/site.webmanifest" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" type="text/css" href="css/styles.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="deep" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="viewport">
      <div class="map" style="width: {{ map.width }}px; height: {{ map.height }}px">
        <svg
          class="wiring"
          viewBox="0 0 {{ map.width }} {{ map.height }}"
          width="{{ map.width }}"
          height="{{ map.height }}"
          aria-hidden="true"
        >
          <circle class="heart" cx="{{ map.heart_x }}" cy="{{ map.heart_y }}" r="4" />
          {%- for trunk in map.trunks %}
          <path class="trunk" d="{{ trunk.d | safe }}" style="--tone: var(--tone-{{ trunk.tone }})" />
          {%- endfor %}
          {%- for spine in map.spines %}
          <path class="spine" d="{{ spine | safe }}" />
          {%- endfor %}
          {%- for branch in map.branches %}
          <g style="--tone: var(--tone-{{ branch.tone }})">
            <path class="stem" d="{{ branch.stem | safe }}" />
            {%- for leaf in branch.leaves %}
            <path class="vein" d="{{ leaf.vein | safe }}" />
            {%- endfor %}
            <circle class="node" cx="{{ branch.dot_x }}" cy="{{ branch.dot_y }}" r="3.4" />
          </g>
          {%- endfor %}
        </svg>

        <h1 class="root" style="left: {{ map.root_x }}px; top: {{ map.root_y }}px">
          {{ startpage.name }}
        </h1>

        {%- for other in map.others %}
        <a class="other" style="left: {{ other.x }}px; top: {{ other.y }}px" href="{{ other.path | safe }}">{{ other.name }}</a>
        {%- endfor %}

        {%- for branch in map.branches %}
        <h2
          class="branch"
          style="left: {{ branch.x }}px; top: {{ branch.y }}px; --tone: var(--tone-{{ branch.tone }})"
        >{{ branch.name }}</h2>
        {%- for leaf in branch.leaves %}
        <a
          class="leaf"
          style="left: {{ leaf.x }}px; top: {{ leaf.y }}px; --tone: var(--tone-{{ branch.tone }})"
          href="{{ leaf.url | safe }}"
        ><span class="ico" aria-hidden="true">{{ leaf.ico | safe }}</span
          ><span class="lbl">{{ leaf.lbl }}</span></a>
        {%- endfor %}
        {%- endfor %}
      </div>
    </div>
  </body>
</html>
